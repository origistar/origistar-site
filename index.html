<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#070b16">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="origistar">
<title>origistar</title>
<link rel="stylesheet" href="assets/style.css">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="assets/icon-192.png">
</head>
<body>
<script src="assets/data.js"></script>
<script src="assets/market-live.js"></script>
<script src="assets/defensive-live.js"></script>
<script src="assets/cb-live.js"></script>
<script src="assets/aggressive-live.js"></script>
<script src="assets/aipo-live.js"></script>
<script>
(function () {
  var d = window.ORIGISTAR; if (!d || !d.updated) return;
  var dates = [d.updated];
  [window.MARKET_LIVE, window.DEFENSIVE_LIVE, window.CB_LIVE, window.AGGRESSIVE_LIVE, window.AIPO_LIVE].forEach(function (L) {
    if (L && L.generatedAt) dates.push(L.generatedAt);
  });
  d.updated = dates.reduce(function (a, b) { return a > b ? a : b; });
})();
</script>
<script src="assets/nav.js" data-system="home"></script>

<div class="wrap">

  <p class="site-slogan">长坡厚雪，守拙日拱</p>

  <!-- 今日信号（直截了当的清单） -->
  <section class="section" style="margin-top:16px">
    <div class="dash-card">
      <div class="dash-head">
        <span class="dash-title">今日信号</span>
        <span class="dash-date" id="dash-date">更新中…</span>
      </div>
      <div id="signal-list" class="signal-list"></div>
    </div>
  </section>

  <!-- 打新日历（A股新股含北交所 + 可转债） -->
  <section class="section">
    <div class="dash-card">
      <div class="dash-head">
        <span class="dash-title">打新日历</span>
        <span class="dash-date" id="aipo-date">—</span>
      </div>
      <div id="aipo-stats" class="aipo-stats"></div>
      <div id="aipo-list"></div>
      <div class="aipo-legend">
        <span><b class="lg-bj">北交所</b> 全额缴款 · 比例配售 · 不占市值</span>
        <span><b class="lg-sh">沪深</b> 市值配号 · 中签后缴款</span>
      </div>
    </div>
  </section>

  <!-- 进取仓预警 -->
  <section class="section">
    <div class="dash-card">
      <div class="dash-head">
        <span class="dash-title">观察仓触发</span>
        <a class="dash-more" href="aggressive/index.html">详情 ›</a>
      </div>
      <div id="aggro-alerts"></div>
    </div>
  </section>

  <!-- 系统配置追踪（3:3:4） -->
  <section class="section">
    <div class="dash-card">
      <div class="dash-head">
        <span class="dash-title">系统配置 · 3:3:4</span>
        <span class="dash-date" id="cfg-date">—</span>
      </div>
      <div id="config-track"></div>
    </div>
  </section>

</div>

<footer class="foot">Origistar · 长坡厚雪，守拙日拱 · 数据仅供参考，非投资建议</footer>

<script src="assets/home.js"></script>
</body>
</html>
