name: 进取仓行情自动更新

on:
  schedule:
    # 北京时间 08:30 / 16:30 / 23:00  =  UTC 00:30 / 08:30 / 15:00
    - cron: "30 0,8,15 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-aggressive
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 拉取仓库
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: 配置 Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: 拉取行情并计算 5 阶段
        run: node scripts/fetch-aggressive.mjs

      - name: 提交并推送
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/aggressive-live.js
          if git diff --cached --quiet; then
            echo "无变化，跳过提交"
          else
            git commit -m "chore: 进取仓行情自动更新 $(TZ=Asia/Shanghai date +'%Y-%m-%d %H:%M')"
            git push
          fi
