name: 全站数据自动更新

on:
  schedule:
    # 北京时间 08:30 / 16:30 / 23:00  =  UTC 00:30 / 08:30 / 15:00
    - cron: "30 0,8,15 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-all
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: 拉取仓库
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: 配置 Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      # 每个数据源独立执行；任一失败不阻塞其余（continue-on-error）
      - name: 进取仓行情（Yahoo + 东财兜底）
        id: aggressive
        continue-on-error: true
        run: node scripts/fetch-aggressive.mjs

      - name: 防守仓行情（SCHD / BRK.B / 黄金）
        id: defensive
        continue-on-error: true
        run: node scripts/fetch-defensive.mjs

      - name: 大盘与 BTC（NDX / VIX / BTC / AHR999 / MSTR）
        id: market
        continue-on-error: true
        run: node scripts/fetch-market.mjs

      - name: 港股打新与待入通（腾讯 gtimg）
        id: hk
        continue-on-error: true
        run: node scripts/fetch-hk.mjs

      - name: 港股打新事实字段补全（东财发行价/每手/市值 + A+H 识别 + 标准锁定期规则）
        id: hk-enrich
        continue-on-error: true
        run: node scripts/enrich-hk.mjs

      - name: 可转债双低（旧站每日筛选数据同步）
        id: cb
        continue-on-error: true
        run: node scripts/fetch-cb.mjs

      - name: 打新日历（东财 A股新股含北交所 + 可转债新债 + gtimg 正股行情）
        id: aipo
        continue-on-error: true
        run: node scripts/fetch-aipo.mjs

      - name: 纳指定投历史（蛋卷PE + Yahoo NDX/VIX + 513100溢价）
        id: ndxhist
        continue-on-error: true
        run: node scripts/fetch-ndx-history.mjs

      - name: 汇总各数据源结果
        run: |
          echo "进取仓: ${{ steps.aggressive.outcome }}"
          echo "防守仓: ${{ steps.defensive.outcome }}"
          echo "大盘BTC: ${{ steps.market.outcome }}"
          echo "港股:   ${{ steps.hk.outcome }}"
          echo "港股补全: ${{ steps.hk-enrich.outcome }}"
          echo "可转债: ${{ steps.cb.outcome }}"
          echo "打新日历: ${{ steps.aipo.outcome }}"
          echo "纳指定投: ${{ steps.ndxhist.outcome }}"

      # 回写站点统一更新时间（仅改 data.js.updated，使低频静态页「更新于」与每日抓取时间一致）
      - name: 回写数据更新时间
        run: node scripts/stamp-data.mjs

      # 单一提交 + 单一 push，彻底避免多工作流并发推送冲突
      - name: 提交并推送（带 rebase 重试）
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A assets/aggressive-live.js assets/defensive-live.js assets/market-live.js assets/cb-live.js assets/aipo-live.js assets/data.js low-risk/hk-data.json stable/state.json
          if git diff --cached --quiet; then
            echo "无变化，跳过提交"
            exit 0
          fi
          git commit -m "chore: 全站数据自动更新 $(TZ=Asia/Shanghai date +'%Y-%m-%d %H:%M')"
          for i in 1 2 3 4 5; do
            if git push; then
              echo "推送成功（第 $i 次尝试）"
              exit 0
            fi
            echo "推送失败，拉取远端后重试..."
            git pull --rebase --autostash origin main || true
            sleep 5
          done
          echo "::error::连续 5 次推送失败"
          exit 1

      # 同步静态站到腾讯云 COS（国内免备案可访问；密钥来自 GitHub Secrets，不全文落库）
      - name: 同步静态站到腾讯云 COS
        id: cos
        continue-on-error: true
        env:
          COS_SECRET_ID: ${{ secrets.COS_SECRET_ID }}
          COS_SECRET_KEY: ${{ secrets.COS_SECRET_KEY }}
          COS_BUCKET: ${{ secrets.COS_BUCKET }}
          COS_REGION: ${{ secrets.COS_REGION }}
        run: |
          CLI="$RUNNER_TEMP/coscli"
          echo "下载 coscli ..."
          curl -fsSL https://cosbrowser.cloud.tencent.com/software/coscli/coscli-linux-amd64 -o "$CLI" \
            || curl -fsSL https://github.com/TencentCloud/coscli/releases/latest/download/coscli-linux-amd64 -o "$CLI"
          chmod +x "$CLI"
          "$CLI" --version
          CFG="$RUNNER_TEMP/cos.yaml"
          printf 'cos:\n  base:\n    secretid: %s\n    secretkey: %s\n    sessiontoken: ""\n    protocol: https\nbuckets:\n  - name: %s\n    alias: os\n    region: %s\n    endpoint: cos.%s.myqcloud.com\n    ofs: false\n' "$COS_SECRET_ID" "$COS_SECRET_KEY" "$COS_BUCKET" "$COS_REGION" "$COS_REGION" > "$CFG"
          export COS_CONFIG="$CFG"
          echo "===== cos.yaml（密钥已打码）====="
          sed -E 's/(secretid|secretkey): .*/\1: ***masked***/' "$CFG"
          echo "同步到 cos://$COS_BUCKET ..."
          cd "$GITHUB_WORKSPACE/.."
          "$CLI" sync origistar-site "cos://os/" -r --config "$CFG" --exclude ".git/**" --exclude ".github/**" --exclude "scripts/**" \
          && echo "COS 同步完成 ✅" || echo "COS 同步失败 ⚠️（不影响数据更新，下次运行重试）"
