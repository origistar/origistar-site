name: update-defensive

on:
  schedule:
    # 北京时间 08:30 / 16:30 / 23:00 = UTC 00:30 / 08:30 / 15:00
    - cron: "30 0,8,15 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Fetch defensive quotes
        run: node scripts/fetch-defensive.mjs
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/defensive-live.js
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "chore(defensive): auto update SCHD/BRK.B/GC=F quotes [$(date -u +%Y-%m-%d)]"
            git push
          fi
