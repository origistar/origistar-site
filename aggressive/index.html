<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#070b16">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="origistar">
<title>进取仓 | origistar</title>
<link rel="stylesheet" href="../assets/style.css">
<link rel="manifest" href="../manifest.json">
<link rel="apple-touch-icon" href="../assets/icon-192.png">
</head>
<body>
<script src="../assets/data.js"></script>
<script src="../assets/aggressive-live.js"></script>
<script src="../assets/nav.js" data-system="aggressive" data-page="index"></script>

<div class="wrap">
  <section class="sys-hero">
    <h1 class="section-title">进取仓</h1>
    <p class="lead">买全球最好、有定价权的垄断公司，用纪律对抗波动</p>
  </section>

  <!-- 持仓 -->
  <section class="section">
    <div class="section-head"><h2>持仓</h2></div>
    <div class="table-wrap">
      <table class="tbl tbl-compact" id="tbl-holdings">
        <thead><tr>
          <th>标的</th><th>仓位</th><th>最新价</th><th>预设卖出价</th><th title="第④层清仓线 = 峰值(52周最高) × (1−3×ATR%)，ratchet 高点止损">趋势止盈价（④）</th><th>5 阶段</th><th>备注</th>
        </tr></thead>
        <tbody></tbody>
      </table>
    </div>
  </section>

  <!-- 观察仓 -->
  <section class="section">
    <div class="section-head"><h2>观察仓</h2></div>
    <div class="table-wrap">
      <table class="tbl tbl-compact" id="tbl-watch">
        <thead><tr>
          <th>标的</th><th>仓位</th><th>最新价</th><th title="用户买一价；最新价≤买一=触发买一（行底色+药丸）">买一价</th><th>买二价</th><th title="距买一 = (最新价−买一价)/买一价；≤0 即触发买一">距买一</th><th>备注</th>
        </tr></thead>
        <tbody></tbody>
      </table>
    </div>
  </section>
  <!-- 趋势止盈规则 -->
  <section class="section">
    <div class="section-head"><h2>趋势止盈规则</h2><span class="sub">5 层规则 · 个股独立校准</span></div>
    <table class="tbl" style="margin-top:12px">
      <thead><tr><th>层级</th><th>触发条件</th><th>动作</th></tr></thead>
      <tbody id="a-rules"></tbody>
    </table>
  </section>
</div>

<footer class="foot">origistar · 进取仓 · 时间均为北京时间 · 数据仅供参考，非投资建议</footer>

<script>
(function(){
  var a = (window.ORIGISTAR && window.ORIGISTAR.aggressive); if(!a) return;
  var LIVE = window.AGGRESSIVE_LIVE; // 行情自动拉取产物，可能不存在（静态降级）

  function esc(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
  function priceFmt(cur, n){
    if(n==null || isNaN(n)) return '—';
    var fixed = (Math.abs(n) < 10) ? 2 : 2;
    return esc(cur || '') + n.toFixed(fixed);
  }
  function weightCls(w){ if(w==='重') return 'up'; if(w==='轻') return 'flat'; return 'acc'; }
  function stageClass(st){ return ['flat','acc','warn','warn','up'][st] || 'flat'; }
  function liveOf(name, bucket){ return (LIVE && LIVE[bucket] && LIVE[bucket][name]) || null; }

  function stageReason(lv){
    switch(lv.stage){
      case 4: return '距高点回撤 ' + (lv.ddPkAtr!=null?lv.ddPkAtr.toFixed(1):'?') + '×ATR';
      case 3: return '收盘<MA50 且 周线<MA10';
      case 2: return (lv.atrPctPercentile!=null && lv.atrPctPercentile>0.75)
                ? ('ATR%分位 ' + (lv.atrPctPercentile*100).toFixed(0) + '%')
                : ('单日 +' + ((lv.dailyRet||0)*100).toFixed(1) + '%');
      case 1: return (lv.consec>=2) ? ('连' + lv.consec + '日<MA20') : ('距高点 ' + (lv.ddPkAtr!=null?lv.ddPkAtr.toFixed(1):'?') + '×ATR');
      default: return (lv.ma20!=null) ? ('价格' + (lv.price>lv.ma20?'>MA20':'<MA20') + '·常态') : '常态';
    }
  }
  function renderStage(lv){
    if(!lv) return '<span class="tag flat">—</span>';
    var sc = stageClass(lv.stage);
    return '<span class="tag ' + sc + '">' + esc(lv.stageLabel) + '</span>' +
           '<div class="mini">' + esc(stageReason(lv)) + '</div>';
  }

  // 持仓表
  var hBody = document.querySelector('#tbl-holdings tbody');
  if(hBody){
    hBody.innerHTML = (a.holdings||[]).map(function(h){
      var lv = liveOf(h.name, 'items');
      var price = (lv && lv.price!=null) ? lv.price : h.lastPrice;
      var trendStop = (lv && lv.trendStop!=null) ? lv.trendStop
                    : (h.lastPrice!=null && h.atrPct!=null ? h.lastPrice*(1-3*h.atrPct) : null);
      var codeShow = (lv && lv.yahooSymbol) ? lv.yahooSymbol : (h.code || '');
      return '<tr>' +
        '<td><b>' + esc(h.name) + '</b><br><small class="muted">' + esc(codeShow) + ' · ' + esc(h.market||'') + '</small></td>' +
        '<td><span class="tag ' + weightCls(h.weight) + '">' + esc(h.weight||'—') + '</span></td>' +
        '<td class="num">' + priceFmt(h.currency, price) + '</td>' +
        '<td class="num">' + (h.userSellWarn==null ? '待设' : priceFmt(h.currency, h.userSellWarn)) + '</td>' +
        '<td class="num"><span class="tag acc">' + priceFmt(h.currency, trendStop) + '</span></td>' +
        '<td>' + renderStage(lv) + '</td>' +
        '<td>' + esc(h.note||'') + '</td>' +
      '</tr>';
    }).join('');
  }

  // 观察仓表
  function watchTrigger(price, w){
    if(price==null) return 'none';
    if(w.userBuyWarn2!=null && price <= w.userBuyWarn2) return 'buy2';
    if(w.userBuyWarn!=null && price <= w.userBuyWarn) return 'buy1';
    return 'none';
  }
  function watchDistBuy1(price, w){
    if(price==null || w.userBuyWarn==null || w.userBuyWarn<=0) return null;
    return (price - w.userBuyWarn) / w.userBuyWarn; // 正=还需跌这么多才到买一；负=已到买一区
  }
  function fmtDistPct(d){
    if(d==null) return { txt:'—', cls:'flat' };
    var pct = d*100;
    var txt = (pct>=0?'+':'') + pct.toFixed(1) + '%';
    var cls = pct<=0 ? 'up' : (pct<=10 ? 'acc' : 'flat'); // 已到买一(up)/接近(acc)/尚远(flat)
    return { txt:txt, cls:cls };
  }
  var wBody = document.querySelector('#tbl-watch tbody');
  if(wBody){
    wBody.innerHTML = (a.watch||[]).map(function(w){
      var lv = liveOf(w.name, 'watchItems');
      var price = (lv && lv.price!=null) ? lv.price : w.lastPrice;
      var buy = (lv && lv.buyPoint!=null) ? lv.buyPoint
              : (w.lastPrice!=null && w.atrPct!=null ? w.lastPrice*(1-2*w.atrPct) : null);
      var trig = (lv && lv.trigger) ? lv.trigger : watchTrigger(price, w);
      var codeShow = (lv && lv.yahooSymbol) ? lv.yahooSymbol : (w.code || '');
      var rowCls = trig==='buy2' ? ' trig-buy2' : trig==='buy1' ? ' trig-buy1' : '';
      var pill = trig==='buy1' ? '<span class="pill pill-buy1">● 触发买一</span>'
               : trig==='buy2' ? '<span class="pill pill-buy2">● 触发买二</span>' : '';
      var buy1cell = (w.userBuyWarn==null ? '待设' : priceFmt(w.currency, w.userBuyWarn)) + pill;
      return '<tr class="' + rowCls + '">' +
        '<td><b>' + esc(w.name) + '</b><br><small class="muted">' + esc(codeShow) + ' · ' + esc(w.market||'') + '</small></td>' +
        '<td><span class="tag ' + weightCls(w.weight) + '">' + esc(w.weight||'—') + '</span></td>' +
        '<td class="num">' + priceFmt(w.currency, price) + '</td>' +
        '<td class="num">' + buy1cell + '</td>' +
        '<td class="num">' + (w.userBuyWarn2==null ? '待设' : priceFmt(w.currency, w.userBuyWarn2)) + '</td>' +
        (function(){ var di = fmtDistPct(watchDistBuy1(price, w)); return '<td class="num"><span class="tag ' + di.cls + '">' + di.txt + '</span></td>'; })() +
        '<td>' + esc(w.note||'') + '</td>' +
      '</tr>';
    }).join('');
  }

  // 规则表
  var rEl = document.getElementById('a-rules');
  if(rEl) rEl.innerHTML = (a.stopRules||[]).map(function(r){
    return '<tr><td class="num">' + esc(r.layer) + '</td><td>' + esc(r.cond) + '</td><td><b>' + esc(r.action) + '</b></td></tr>';
  }).join('');

})();
</script>
</body>
</html>
