<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#070b16">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="origistar">
  <meta name="theme-color" content="#070b16" />
  <title>研习录 · origistar</title>
  <link rel="stylesheet" href="../assets/style.css" />
</head>
<body>
  <main class="wrap" style="padding-bottom: calc(var(--tab-h) + 40px);">
    <div class="hero">
      <span class="badge"><span class="dot b"></span>个人知识库</span>
      <h1>研习录</h1>
      <p class="lead">读书纪要、研报重点、投资笔记的归档区。一本书、一份报告、一个主题一页。</p>
    </div>

    <div class="section">
      <div class="rule">
        <h3>内容组织方式</h3>
        <p>每一本书 / 每一份重点研报 / 每一个深度主题独立一页，统一版式，方便后续检索。暂时为空，内容待补充。</p>
      </div>
    </div>

    <div class="section">
      <div class="section-head">
        <h2>近期阅读</h2>
        <span class="sub">待补充</span>
      </div>
      <div class="grid c2" id="studyList">
        <div class="card">
          <h3 style="margin:0 0 6px">📚 待添加</h3>
          <p class="muted" style="margin:0; font-size:14px">这里将列出最近在读或已完成的书籍/研报，点进去看详细纪要。</p>
        </div>
      </div>
    </div>

    <div class="section">
      <div class="section-head">
        <h2>标签索引</h2>
        <span class="sub">待整理</span>
      </div>
      <div class="sysrow" style="opacity:.7">
        <div>
          <div class="st">主题标签</div>
          <div class="sd">财报 · 估值 · 行为金融 · 宏观 · 行业 · 个股深度</div>
        </div>
      </div>
    </div>
  </main>

  <footer class="foot">
    origistar · 个人投资组合监测站
  </footer>

  <script src="../assets/nav.js" data-system="study" data-page="index"></script>
</body>
</html>
